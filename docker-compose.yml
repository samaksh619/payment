services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payflow
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["mysql_data:/var/lib/mysql"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth:
    restart: on-failure:5
    build: ./backend/auth-service
    ports: ["8081:8081"]
    environment: [SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payflow]
    depends_on:
      mysql:
        condition: service_healthy

  account:
    restart: on-failure:5
    build: ./backend/account-service
    ports: ["8082:8082"]
    environment: [SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payflow]
    depends_on:
      mysql:
        condition: service_healthy

  payment:
    restart: on-failure:5
    build: ./backend/payment-service
    ports: ["8083:8083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payflow
      ACCOUNT_SERVICE_URL: http://account:8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account:
        condition: service_started

  transaction:
    restart: on-failure:5
    build: ./backend/transaction-service
    ports: ["8084:8084"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    restart: on-failure:5
    build: ./backend/notification-service
    ports: ["8085:8085"]
    environment: [SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092]
    depends_on:
      kafka:
        condition: service_healthy

  gateway:
    restart: on-failure:5
    build: ./backend/gateway-service
    ports: ["8080:8080"]
    depends_on:
      - auth
      - account
      - payment
      - transaction

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on:
      - gateway

volumes:
  mysql_data:
