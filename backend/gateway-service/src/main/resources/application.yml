server:
  error:
    include-message: always
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth
          uri: http://auth:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: account
          uri: http://account:8082
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1

        - id: payment
          uri: http://payment:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

        - id: transaction
          uri: http://transaction:8084
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=1